<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mesa · Tu semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   TOKENS
══════════════════════════════════════════════ */
:root {
  --ink:       #0d0f0e;
  --surface:   #141714;
  --card:      #1b1f1b;
  --card2:     #222622;
  --line:      #2a302a;
  --line2:     #333b33;
  --copper:    #e8845a;
  --copper-d:  #b85e38;
  --copper-bg: rgba(232,132,90,.1);
  --copper-br: rgba(232,132,90,.2);
  --sage:      #7ab88a;
  --sage-bg:   rgba(122,184,138,.1);
  --sage-br:   rgba(122,184,138,.22);
  --cream:     #f0ead8;
  --cream2:    #c8c0ae;
  --muted:     #7a8479;
  --gold:      #d4a843;
  --gold-bg:   rgba(212,168,67,.1);
  --r:         16px;
  --rs:        10px;
  --rx:        22px;
  --ease:      cubic-bezier(.32,0,.18,1);
  --spring:    cubic-bezier(.34,1.56,.64,1);
}

/* ══════════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  height: 100%; overflow: hidden;
  background: var(--ink);
  color: var(--cream);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input  { font-family: inherit; }

/* ══════════════════════════════════════════════
   LAYOUT SHELL
══════════════════════════════════════════════ */
.shell {
  display: flex; flex-direction: column;
  height: 100dvh; height: 100vh;
  overflow: hidden;
}

/* ── HEADER ─────────────────────────────────── */
.hdr {
  flex-shrink: 0;
  padding: 14px 20px 0;
  background: var(--ink);
  border-bottom: 1px solid var(--line);
}
.hdr-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 22px; color: var(--cream);
  letter-spacing: -.3px;
}
.logo span { color: var(--copper); }
.hdr-right { display: flex; align-items: center; gap: 10px; }
.clock-pill {
  font-size: 12px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--copper);
  background: var(--copper-bg);
  border: 1px solid var(--copper-br);
  padding: 4px 11px; border-radius: 20px;
  letter-spacing: .3px;
}

/* day strip */
.day-strip {
  display: flex; gap: 4px;
  overflow-x: auto; scrollbar-width: none;
  padding-bottom: 14px;
}
.day-strip::-webkit-scrollbar { display: none; }
.dp {
  flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 7px 10px; border-radius: var(--rs);
  border: 1.5px solid transparent;
  background: transparent; color: var(--muted);
  font-size: 11px; font-weight: 700; letter-spacing: .4px;
  text-transform: uppercase; transition: .18s var(--ease);
  min-width: 44px;
}
.dp .dnum {
  font-size: 15px; font-weight: 800; color: var(--muted);
  line-height: 1; font-variant-numeric: tabular-nums;
}
.dp.today { color: var(--copper); }
.dp.today .dnum { color: var(--copper); }
.dp.sel {
  background: var(--copper-bg);
  border-color: var(--copper-br);
  color: var(--copper);
}
.dp.sel .dnum { color: var(--cream); }

/* ── TABS ────────────────────────────────────── */
.tabs {
  flex-shrink: 0;
  display: flex; gap: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px;
  padding: 10px 4px 8px;
  color: var(--muted); font-size: 10px; font-weight: 700;
  letter-spacing: .4px; text-transform: uppercase;
  border-bottom: 2px solid transparent;
  transition: .15s var(--ease);
}
.tab .ticon { font-size: 18px; line-height: 1; }
.tab.on { color: var(--copper); border-bottom-color: var(--copper); }

/* ── CONTENT SCROLL ──────────────────────────── */
.content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

/* ══════════════════════════════════════════════
   VIEWS
══════════════════════════════════════════════ */
.view { display: none; padding: 20px 20px 32px; }
.view.on { display: block; animation: fadeSlide .22s var(--ease) both; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════════════════════
   HOY VIEW — components
══════════════════════════════════════════════ */

/* now banner */
.now-card {
  background: var(--card);
  border: 1px solid var(--line2);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 20px;
  position: relative; overflow: hidden;
}
.now-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--copper), transparent 70%);
}
.now-eyebrow {
  font-size: 10px; font-weight: 800; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--copper);
  margin-bottom: 7px;
}
.now-title {
  font-family: 'DM Serif Display', serif;
  font-size: 24px; line-height: 1.15; letter-spacing: -.3px;
  color: var(--cream); margin-bottom: 4px;
}
.now-sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.now-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.ntag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px;
}
.ntag-copper { background: var(--copper-bg); color: var(--copper); border: 1px solid var(--copper-br); }
.ntag-sage   { background: var(--sage-bg);   color: var(--sage);   border: 1px solid var(--sage-br); }
.ntag-gold   { background: var(--gold-bg);   color: var(--gold);   border: 1px solid rgba(212,168,67,.2); }

/* section heading */
.sec-head {
  font-size: 11px; font-weight: 800; letter-spacing: 1.3px;
  text-transform: uppercase; color: var(--muted);
  margin: 24px 0 12px;
  display: flex; align-items: center; gap: 10px;
}
.sec-head::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* meal cards — big tappable cards */
.meal-card {
  background: var(--card);
  border: 1px solid var(--line2);
  border-radius: var(--r);
  padding: 0; margin-bottom: 10px;
  overflow: hidden; cursor: pointer;
  transition: .18s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.meal-card:active { transform: scale(.985); opacity: .9; }
.meal-card-inner { padding: 16px 18px; }
.meal-card-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 10px;
  margin-bottom: 10px;
}
.meal-label {
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; padding: 3px 8px;
  border-radius: 8px; display: inline-block;
}
.ml-comida { background: rgba(122,184,138,.12); color: var(--sage); }
.ml-cena   { background: rgba(232,132,90,.1);   color: var(--copper); }
.ml-desay  { background: rgba(212,168,67,.1);   color: var(--gold); }
.meal-time {
  font-size: 11px; font-weight: 700; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.meal-name {
  font-family: 'DM Serif Display', serif;
  font-size: 20px; line-height: 1.2; letter-spacing: -.2px;
  color: var(--cream); margin-bottom: 6px;
}
.meal-tagline { font-size: 13px; color: var(--muted); line-height: 1.45; margin-bottom: 12px; }
.meal-footer {
  display: flex; gap: 8px; flex-wrap: wrap;
  align-items: center; justify-content: space-between;
}
.meal-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 20px;
  background: var(--card2); color: var(--muted);
  border: 1px solid var(--line);
}
.chip.prot { color: var(--sage); background: var(--sage-bg); border-color: var(--sage-br); }
.chip.kcal { color: var(--gold); background: var(--gold-bg); border-color: rgba(212,168,67,.2); }
.meal-arrow {
  font-size: 16px; color: var(--muted); flex-shrink: 0;
}
.meal-divider { height: 1px; background: var(--line); }
.meal-prep-strip {
  padding: 10px 18px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
}
.meal-prep-strip .prep-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); flex-shrink: 0;
}

/* desayuno card grid */
.bf-grid { display: flex; flex-direction: column; gap: 8px; }
.bf-card {
  background: var(--card);
  border: 1px solid var(--line2);
  border-radius: var(--rs);
  padding: 13px 15px;
  display: flex; gap: 12px; align-items: flex-start;
  cursor: pointer; transition: .15s var(--ease);
}
.bf-card:active { transform: scale(.985); }
.bf-letter {
  width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
  background: var(--gold-bg); color: var(--gold);
  font-family: 'DM Serif Display', serif;
  font-size: 17px; display: flex; align-items: center; justify-content: center;
}
.bf-name { font-size: 14px; font-weight: 700; color: var(--cream); margin-bottom: 3px; }
.bf-items { font-size: 12px; color: var(--muted); line-height: 1.55; }

/* macros bar */
.macro-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-bottom: 20px;
}
.macro-box {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--rs); padding: 12px 8px; text-align: center;
}
.macro-val {
  font-size: 18px; font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums; margin-bottom: 3px;
}
.macro-val.kc { color: var(--gold); }
.macro-val.pr { color: var(--sage); }
.macro-val.ti { color: var(--copper); }
.macro-val.di { color: var(--cream2); }
.macro-lbl {
  font-size: 9px; font-weight: 700; letter-spacing: .6px;
  text-transform: uppercase; color: var(--muted);
}

/* ══════════════════════════════════════════════
   SEMANA VIEW
══════════════════════════════════════════════ */
.week-day {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--r); margin-bottom: 8px; overflow: hidden;
}
.week-day-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; cursor: pointer; transition: .15s;
}
.week-day-hdr:active { background: var(--card2); }
.week-day-name {
  font-size: 14px; font-weight: 700; color: var(--cream);
  display: flex; align-items: center; gap: 8px;
}
.today-badge {
  font-size: 9px; font-weight: 800; letter-spacing: .6px;
  text-transform: uppercase;
  background: var(--copper); color: #fff;
  padding: 2px 7px; border-radius: 8px;
}
.week-day-arrow {
  font-size: 14px; color: var(--muted);
  transition: transform .2s var(--ease);
}
.week-day.open .week-day-arrow { transform: rotate(90deg); }
.week-day-body { display: none; }
.week-day.open .week-day-body { display: block; }
.week-meal-row {
  display: flex; gap: 10px; align-items: center;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  cursor: pointer; transition: .15s;
}
.week-meal-row:active { background: var(--card2); }
.wm-icon { font-size: 20px; flex-shrink: 0; }
.wm-info { flex: 1; }
.wm-type {
  font-size: 9px; font-weight: 800; letter-spacing: .8px;
  text-transform: uppercase; margin-bottom: 2px;
}
.wm-type.c { color: var(--sage); }
.wm-type.ce { color: var(--copper); }
.wm-name { font-size: 13px; font-weight: 600; color: var(--cream); line-height: 1.3; }
.wm-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.wm-arrow { font-size: 14px; color: var(--line2); }

/* ══════════════════════════════════════════════
   COMPRA VIEW
══════════════════════════════════════════════ */
.shop-top {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--r); padding: 16px; margin-bottom: 14px;
}
.shop-top-title { font-size: 16px; font-weight: 700; color: var(--cream); margin-bottom: 4px; }
.shop-top-sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.prog-wrap { background: var(--line); border-radius: 3px; height: 4px; }
.prog-fill {
  height: 100%; border-radius: 3px;
  background: var(--sage);
  transition: width .4s var(--ease);
}
.prog-label {
  font-size: 11px; font-weight: 700; color: var(--sage);
  margin-top: 6px; text-align: right;
  font-variant-numeric: tabular-nums;
}

.shop-section { margin-bottom: 6px; }
.shop-cat-lbl {
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; color: var(--muted);
  padding: 14px 0 8px;
}
.shop-list {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--r); overflow: hidden;
}
.shop-item {
  display: flex; align-items: center; gap: 13px;
  padding: 11px 15px; cursor: pointer;
  border-bottom: 1px solid var(--line);
  transition: .13s;
}
.shop-item:last-child { border-bottom: none; }
.shop-item:active { background: var(--card2); }
.s-check {
  width: 21px; height: 21px; border-radius: 50%;
  border: 1.5px solid var(--line2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: .15s var(--ease);
}
.shop-item.ck .s-check {
  background: var(--sage); border-color: var(--sage);
}
.s-check-mark { display: none; }
.shop-item.ck .s-check-mark {
  display: block; font-size: 11px; color: #0d0f0e; font-weight: 800;
}
.s-name {
  flex: 1; font-size: 13px; color: var(--cream);
  transition: .13s; line-height: 1.3;
}
.shop-item.ck .s-name { color: var(--muted); text-decoration: line-through; }
.s-qty { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.reset-btn {
  width: 100%; padding: 13px; border-radius: var(--r);
  border: 1px solid var(--line2); background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 600;
  margin-top: 10px; transition: .15s;
}
.reset-btn:active { background: var(--card2); }

/* ══════════════════════════════════════════════
   PREP VIEW
══════════════════════════════════════════════ */
.prep-day {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--r); margin-bottom: 10px; overflow: hidden;
}
.prep-day-hdr {
  padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line); cursor: pointer;
  transition: .13s;
}
.prep-day-hdr:active { background: var(--card2); }
.prep-day-title { font-size: 14px; font-weight: 700; color: var(--cream); }
.prep-day-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
.prep-day-pct {
  font-size: 13px; font-weight: 800;
  color: var(--sage); flex-shrink: 0;
}
.prep-items { }
.prep-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
  cursor: pointer; transition: .13s;
}
.prep-item:last-child { border-bottom: none; }
.prep-item:active { background: var(--card2); }
.prep-ico { font-size: 18px; flex-shrink: 0; padding-top: 1px; }
.prep-txt { flex: 1; font-size: 13px; color: var(--cream); line-height: 1.5; transition: .13s; }
.prep-item.ck .prep-txt { color: var(--muted); text-decoration: line-through; }
.prep-chk {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--line2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: .15s var(--ease); margin-top: 1px;
}
.prep-item.ck .prep-chk { background: var(--sage); border-color: var(--sage); }
.prep-chk-mark { display: none; font-size: 10px; color: #0d0f0e; font-weight: 800; }
.prep-item.ck .prep-chk-mark { display: block; }

/* ══════════════════════════════════════════════
   BOTTOM SHEET (MODAL)
══════════════════════════════════════════════ */
.overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0);
  pointer-events: none;
  transition: background .3s var(--ease);
}
.overlay.show {
  background: rgba(0,0,0,.65);
  pointer-events: all;
}
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 400;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--line2);
  max-height: 92dvh; max-height: 92vh;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform .38s var(--spring);
  overflow: hidden;
}
.sheet.open { transform: translateY(0); }

.sheet-handle-wrap {
  flex-shrink: 0; padding: 12px 0 4px;
  display: flex; justify-content: center; cursor: pointer;
}
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--line2);
}
.sheet-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 4px 22px 48px;
}
.sheet-eyebrow {
  font-size: 10px; font-weight: 800; letter-spacing: 1.3px;
  text-transform: uppercase; color: var(--copper);
  margin-bottom: 8px;
}
.sheet-title {
  font-family: 'DM Serif Display', serif;
  font-size: 26px; line-height: 1.15; color: var(--cream);
  margin-bottom: 6px; letter-spacing: -.3px;
}
.sheet-tagline {
  font-size: 14px; color: var(--muted); line-height: 1.5;
  margin-bottom: 18px;
}
.sheet-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.sh-chip {
  font-size: 12px; font-weight: 700;
  padding: 5px 12px; border-radius: 20px;
}
.sh-chip.prot { background: var(--sage-bg); color: var(--sage); border: 1px solid var(--sage-br); }
.sh-chip.kcal { background: var(--gold-bg); color: var(--gold); border: 1px solid rgba(212,168,67,.2); }
.sh-chip.time { background: var(--copper-bg); color: var(--copper); border: 1px solid var(--copper-br); }
.sh-chip.easy { background: rgba(200,192,174,.06); color: var(--cream2); border: 1px solid var(--line2); }

/* divider within sheet */
.sh-divider {
  height: 1px; background: var(--line);
  margin: 20px 0;
}

/* ingredients */
.sh-section-title {
  font-size: 11px; font-weight: 800; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 12px;
}
.ingredient-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.ingredient {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 12px; border-radius: var(--rs);
  background: var(--card); border: 1px solid var(--line);
}
.ing-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--copper); flex-shrink: 0;
}
.ing-name { flex: 1; font-size: 13px; color: var(--cream); }
.ing-qty { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

/* steps */
.steps-list { display: flex; flex-direction: column; gap: 10px; }
.step-row { display: flex; gap: 14px; align-items: flex-start; }
.step-num-wrap {
  display: flex; flex-direction: column; align-items: center; flex-shrink: 0;
}
.step-num {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--copper-bg); border: 1px solid var(--copper-br);
  color: var(--copper); font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.step-connector {
  width: 1px; flex: 1; min-height: 14px;
  background: var(--line); margin-top: 4px;
}
.step-body { flex: 1; padding-bottom: 6px; }
.step-title { font-size: 13px; font-weight: 700; color: var(--cream); margin-bottom: 2px; }
.step-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }

/* prep note inside sheet */
.prep-note {
  background: var(--gold-bg);
  border: 1px solid rgba(212,168,67,.2);
  border-radius: var(--rs); padding: 13px 14px;
  display: flex; gap: 10px; align-items: flex-start;

   DAY STRIP
════════════════════════════════════════════ */
function buildStrip() {
  const today = new Date().getDay();
  const el = document.getElementById('dayStrip');
  el.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const b = document.createElement('button');
    b.className = 'dp' + (i === today ? ' today' : '') + (i === selDay ? ' sel' : '');
    b.innerHTML = `<span class="dnum">${i === today ? '◉' : (i+1)}</span>${DAYS_S[i]}`;
    b.onclick = () => { selDay = i; buildStrip(); renderHoy(); };
    el.appendChild(b);
  }
  setTimeout(() => {
    const a = el.querySelector('.sel');
    if (a) a.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }, 40);
}

function openSheet(html) {
  document.getElementById('sheetScroll').innerHTML = html;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('overlay').classList.add('show');

}

/* ─── build recipe sheet content ─────────── */
function recipeSheetHTML(recipe, mealType) {
  const labelClass = mealType === 'comida' ? 'ml-comida' : mealType === 'cena' ? 'ml-cena' : 'ml-desay';
  const labelText = mealType === 'comida' ? '☀️ Comida' : mealType === 'cena' ? '🌙 Cena' : '☕ Desayuno';

  const ingredientsHTML = recipe.ingredients
    .map(i => `<div class="ingredient">
      <div class="ing-dot"></div>
      <span class="ing-name">${i.n}</span>
      <span class="ing-qty">${i.q}</span>
    </div>`).join('');

  const stepsHTML = recipe.steps.map((s, idx) => `
    <div class="step-row">
      <div class="step-num-wrap">
        <div class="step-num">${idx + 1}</div>
        ${idx < recipe.steps.length - 1 ? '<div class="step-connector"></div>' : ''}
      </div>
      <div class="step-body">
        <div class="step-title">${s.t}</div>
        <div class="step-desc">${s.d}</div>
      </div>
    </div>`).join('');

  const chipsHTML = (recipe.chips || [
    {t: `${recipe.prot}g proteína`, cls:'prot'},
    {t: `${recipe.kcal} kcal`, cls:'kcal'},
    {t: `${recipe.mins} min`, cls:'time'},
    {t: 'Fácil', cls:'easy'},
  ]).map(c => `<span class="sh-chip ${c.cls}">${c.t}</span>`).join('');

  const prepNoteHTML = recipe.prepNote ? `
    <div class="sh-divider"></div>
    <div class="prep-note">
      <div class="prep-note-ico">💡</div>
      <div class="prep-note-txt"><b>Tip de preparación:</b> ${recipe.prepNote}</div>
    </div>` : '';

  return `
    <div class="sheet-eyebrow"><span class="meal-label ${labelClass}">${labelText}</span></div>
    <div class="sheet-title">${recipe.name}</div>
    <div class="sheet-tagline">${recipe.tagline}</div>
    <div class="sheet-chips">${chipsHTML}</div>
    <div class="sh-divider"></div>
    <div class="sh-section-title">Ingredientes · 2 personas</div>
    <div class="ingredient-list">${ingredientsHTML}</div>
    ${prepNoteHTML}
    <div class="sh-divider"></div>
    <div class="sh-section-title">Preparación</div>
    <div class="steps-list">${stepsHTML}</div>
  `;
}

/* ════════════════════════════════════════════
   NOW LOGIC
════════════════════════════════════════════ */
const BLOCKS = [
  {h:7,  m:30, type:'d',  label:'Desayuno',  title:'Hora del desayuno'},
  {h:10, m:30, type:'s',  label:'Snack',      title:'Tentempié'},
  {h:14, m:0,  type:'c',  label:'Comida',     title:'__comida'},
  {h:17, m:30, type:'s',  label:'Merienda',   title:'Merienda'},
  {h:21, m:0,  type:'ce', label:'Cena',       title:'__cena'},
  {h:23, m:0,  type:'p',  label:'Para mañana',title:'Prepara para mañana'},
];

function getNowBlock(h, m) {
  const t = h * 60 + m;
  for (let i = BLOCKS.length - 1; i >= 0; i--) {
    if (t >= BLOCKS[i].h * 60 + BLOCKS[i].m) return i;
  }
  return null;
}

    items.forEach(item => {
      const idx = gi;
      html += `<div class="shop-item ${shopCk[idx] ? 'ck' : ''}" onclick="ckShop(${idx})">
        <div class="s-check"><span class="s-check-mark">✓</span></div>
        <span class="s-name">${item.n}</span>
        <span class="s-qty">${item.q}</span>
      </div>`;
      gi++;
    });
    html += `</div></div>`;
  });

  html += `<button class="reset-btn" onclick="clearShop()">↺ Reiniciar lista de la compra</button>`;
  document.getElementById('vcompra').innerHTML = html;
}

function ckShop(i) {
  shopCk[i] = !shopCk[i];
  localStorage.setItem('mesa_shop', JSON.stringify(shopCk));
  renderCompra();
}
function clearShop() {
  shopCk = {};
  localStorage.setItem('mesa_shop', '{}');
  renderCompra();
}

/* ════════════════════════════════════════════
   VIEW: PREP
════════════════════════════════════════════ */
function renderPrep() {
  let html = `<div class="info-banner">
    <div class="ib-icon">🔪</div>
    <div class="ib-body">
      <div class="ib-title">Prep por día</div>
      <div class="ib-text">Pequeñas acciones cada día que hacen que cocinar sea <b>10 veces más rápido</b>.</div>
    </div>
  </div>`;

  PREP_DAYS.forEach((pd, pdIdx) => {
    const items    = pd.items;
    const ckCount  = items.filter((_, i) => prepCk[`${pdIdx}_${i}`]).length;
    const pct      = Math.round(ckCount / items.length * 100);

    html += `<div class="prep-day">
      <div class="prep-day-hdr">
        <div>
          <div class="prep-day-title">${pd.day}</div>
          <div class="prep-day-meta">${pd.meta}</div>
        </div>
        <div class="prep-day-pct">${pct}%</div>
      </div>
      <div class="prep-items">
        ${items.map((item, i) => `
          <div class="prep-item ${prepCk[pdIdx + '_' + i] ? 'ck' : ''}" onclick="ckPrep(${pdIdx}, ${i})">
            <div class="prep-ico">${item.ico}</div>
            <div class="prep-txt">${item.txt}</div>
            <div class="prep-chk"><span class="prep-chk-mark">✓</span></div>
          </div>`).join('')}
      </div>
    </div>`;
  });

  html += `
    <div class="sec-head">Conservación</div>
    <div class="prep-day">
      <div class="prep-items">
        <div class="prep-item"><div class="prep-ico">🧊</div><div class="prep-txt" style="text-decoration:none"><b style="color:var(--cream)">Arroz y quinoa cocidos.</b> Tupper hermético en nevera, 4-5 días. Al micro 2 min para calentar.</div><div class="prep-chk" style="visibility:hidden"></div></div>
        <div class="prep-item"><div class="prep-ico">🥚</div><div class="prep-txt" style="text-decoration:none"><b style="color:var(--cream)">Huevos duros.</b> Sin pelar en nevera, hasta 1 semana.</div><div class="prep-chk" style="visibility:hidden"></div></div>
        <div class="prep-item"><div class="prep-ico">🍗</div><div class="prep-txt" style="text-decoration:none"><b style="color:var(--cream)">Pollo cocinado.</b> Tupper en nevera 3 días. Congela si es para más.</div><div class="prep-chk" style="visibility:hidden"></div></div>
        <div class="prep-item"><div class="prep-ico">🥗</div><div class="prep-txt" style="text-decoration:none"><b style="color:var(--cream)">Hojas lavadas.</b> Tupper con papel de cocina, 3-4 días sin que se pongan malas.</div><div class="prep-chk" style="visibility:hidden"></div></div>
        <div class="prep-item"><div class="prep-ico">🫘</div><div class="prep-txt" style="text-decoration:none"><b style="color:var(--cream)">Legumbres abiertas.</b> En tupper con agua fría, máximo 3 días.</div><div class="prep-chk" style="visibility:hidden"></div></div>
      </div>
    </div>
    <button class="reset-btn" onclick="clearPrep()">↺ Reiniciar preparación</button>`;

  document.getElementById('vprep').innerHTML = html;
}

function ckPrep(pd, i) {
  const key = `${pd}_${i}`;
  prepCk[key] = !prepCk[key];
  localStorage.setItem('mesa_prep', JSON.stringify(prepCk));
  renderPrep();
}
function clearPrep() {
  prepCk = {};
  localStorage.setItem('mesa_prep', '{}');
  renderPrep();
}

/* ════════════════════════════════════════════
   NAVIGATION
════════════════════════════════════════════ */
function goTab(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  document.getElementById('v' + name).classList.add('on');
  btn.classList.add('on');
  if (name === 'semana') renderSemana();
  if (name === 'compra') renderCompra();
  if (name === 'prep')   renderPrep();
  if (name === 'hoy')    { renderHoy(); buildStrip(); }
}

/* touch-to-close sheet swipe */
let sheetStartY = 0;
const sheet = document.getElementById('sheet');
sheet.addEventListener('touchstart', e => { sheetStartY = e.touches[0].clientY; }, {passive:true});
sheet.addEventListener('touchend',   e => {
  const dy = e.changedTouches[0].clientY - sheetStartY;
  if (dy > 60) closeSheet();
}, {passive:true});

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
buildStrip();
renderHoy();

setInterval(() => {
  const v = document.querySelector('.view.on');
  if (v && v.id === 'vhoy') renderHoy();
}, 60000);
</script>
