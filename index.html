<style>
:root{
  --ink:#0d0f0e;--surface:#141714;--card:#1b1f1b;--card2:#222622;
  --line:#2a302a;--line2:#333b33;
  --copper:#e8845a;--copper-d:#b85e38;--copper-bg:rgba(232,132,90,.1);--copper-br:rgba(232,132,90,.22);
  --sage:#7ab88a;--sage-bg:rgba(122,184,138,.1);--sage-br:rgba(122,184,138,.22);
  --cream:#f0ead8;--cream2:#c8c0ae;--muted:#7a8479;
  --gold:#d4a843;--gold-bg:rgba(212,168,67,.1);
  --r:16px;--rs:10px;--ease:cubic-bezier(.32,0,.18,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;-webkit-text-size-adjust:100%;}
body{height:100%;overflow:hidden;background:var(--ink);color:var(--cream);font-family:'Inter',-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;user-select:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:inherit;}
.shell{display:flex;flex-direction:column;height:100dvh;height:100vh;overflow:hidden;position:relative;}
.hdr{flex-shrink:0;padding:14px 20px 0;background:var(--ink);border-bottom:1px solid var(--line);position:relative;z-index:10;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.logo{font-family:'DM Serif Display',serif;font-size:17px;color:var(--cream);letter-spacing:-.3px;text-decoration:none;}
.logo span{color:var(--copper);}
.hdr-right{display:flex;align-items:center;gap:10px;}
.clock-pill{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--copper);background:var(--copper-bg);border:1px solid var(--copper-br);padding:4px 11px;border-radius:20px;letter-spacing:.3px;}
.day-strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:14px;}
.day-strip::-webkit-scrollbar{display:none;}
.dp{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 10px;border-radius:var(--rs);border:1.5px solid transparent;background:transparent;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;transition:.18s var(--ease);min-width:44px;}
.dp .dnum{font-size:15px;font-weight:800;color:var(--muted);line-height:1;font-variant-numeric:tabular-nums;}
.dp.today{color:var(--copper);}.dp.today .dnum{color:var(--copper);}
.dp.sel{background:var(--copper-bg);border-color:var(--copper-br);color:var(--copper);}.dp.sel .dnum{color:var(--cream);}
.tabs{flex-shrink:0;display:flex;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:10;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-bottom:2px solid transparent;transition:.15s var(--ease);}
.tab .ticon{font-size:18px;line-height:1;}
.tab.on{color:var(--copper);border-bottom-color:var(--copper);}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;position:relative;}
.view{display:none;padding:20px 20px 48px;}
.view.on{display:block;animation:fadeSlide .22s var(--ease) both;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
/* HOY */
.now-card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:18px;margin-bottom:20px;position:relative;overflow:hidden;}
.now-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--copper),transparent 70%);}
.now-eyebrow{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--copper);margin-bottom:7px;}
.now-title{font-family:'DM Serif Display',serif;font-size:24px;line-height:1.15;letter-spacing:-.3px;color:var(--cream);margin-bottom:4px;}
.now-sub{font-size:13px;color:var(--muted);margin-bottom:12px;}
.now-tags{display:flex;gap:6px;flex-wrap:wrap;}
.ntag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
.ntag-copper{background:var(--copper-bg);color:var(--copper);border:1px solid var(--copper-br);}
.ntag-sage{background:var(--sage-bg);color:var(--sage);border:1px solid var(--sage-br);}
.ntag-gold{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(212,168,67,.2);}
.sec-head{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:24px 0 12px;display:flex;align-items:center;gap:10px;}
.sec-head::after{content:'';flex:1;height:1px;background:var(--line);}
.meal-card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:0;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:.18s var(--ease);-webkit-tap-highlight-color:transparent;}
.meal-card:active{transform:scale(.985);opacity:.9;}
.meal-card-inner{padding:16px 18px;}
.meal-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
.meal-label{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:8px;display:inline-block;}
.ml-comida{background:rgba(122,184,138,.12);color:var(--sage);}
.ml-cena{background:rgba(232,132,90,.1);color:var(--copper);}
.meal-name{font-family:'DM Serif Display',serif;font-size:20px;line-height:1.2;letter-spacing:-.2px;color:var(--cream);margin-bottom:6px;}
.meal-tagline{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:12px;}
.meal-footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.meal-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--muted);border:1px solid var(--line);}
.chip.prot{color:var(--sage);background:var(--sage-bg);border-color:var(--sage-br);}
.chip.kcal{color:var(--gold);background:var(--gold-bg);border-color:rgba(212,168,67,.2);}
.meal-arrow{font-size:16px;color:var(--muted);flex-shrink:0;}
.meal-divider{height:1px;background:var(--line);}
.meal-prep-strip{padding:10px 18px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
.meal-prep-strip .prep-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;}
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;}
.macro-box{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:12px 8px;text-align:center;}
.macro-val{font-size:18px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:3px;}
.macro-val.kc{color:var(--gold);}.macro-val.pr{color:var(--sage);}.macro-val.ti{color:var(--copper);}.macro-val.di{color:var(--cream2);}
.macro-lbl{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);}
/* SEMANA */
.week-day{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);margin-bottom:8px;overflow:hidden;}
.week-day-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;transition:.15s;}
.week-day-hdr:active{background:var(--card2);}
.week-day-name{font-size:14px;font-weight:700;color:var(--cream);display:flex;align-items:center;gap:8px;}
.today-badge{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:var(--copper);color:#fff;padding:2px 7px;border-radius:8px;}
.week-day-arrow{font-size:14px;color:var(--muted);transition:transform .2s var(--ease);}
.week-day.open .week-day-arrow{transform:rotate(90deg);}
.week-day-body{display:none;}
.week-day.open .week-day-body{display:block;}
.week-meal-row{display:flex;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;transition:.15s;}
.week-meal-row:active{background:var(--card2);}
.wm-icon{font-size:20px;flex-shrink:0;}
.wm-info{flex:1;}
.wm-type{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px;}
.wm-type.c{color:var(--sage);}.wm-type.ce{color:var(--copper);}
.wm-name{font-size:13px;font-weight:600;color:var(--cream);line-height:1.3;}
.wm-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.wm-arrow{font-size:14px;color:var(--line2);}
/* COMPRA */
.shop-top{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.shop-top-title{font-size:16px;font-weight:700;color:var(--cream);margin-bottom:4px;}
.shop-top-sub{font-size:13px;color:var(--muted);margin-bottom:12px;}
.prog-wrap{background:var(--line);border-radius:3px;height:4px;}
.prog-fill{height:100%;border-radius:3px;background:var(--sage);transition:width .4s var(--ease);}
.prog-label{font-size:11px;font-weight:700;color:var(--sage);margin-top:6px;text-align:right;font-variant-numeric:tabular-nums;}
/* meal filter */
.meal-filter-section{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);margin-bottom:14px;overflow:hidden;}
.meal-filter-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;}
.meal-filter-hdr:active{background:var(--card2);}
.meal-filter-title{font-size:13px;font-weight:700;color:var(--cream);}
.meal-filter-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.meal-filter-arrow{font-size:14px;color:var(--muted);transition:transform .2s var(--ease);}
.meal-filter-section.open .meal-filter-arrow{transform:rotate(90deg);}
.meal-filter-body{display:none;border-top:1px solid var(--line);}
.meal-filter-section.open .meal-filter-body{display:block;}
.meal-filter-day{border-bottom:1px solid var(--line);padding:10px 16px;}
.meal-filter-day:last-child{border-bottom:none;}
.meal-filter-day-name{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.meal-filter-row{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;}
.meal-filter-row:active{opacity:.7;}
.mf-toggle{width:44px;height:24px;border-radius:12px;background:var(--line2);position:relative;flex-shrink:0;transition:.2s var(--ease);}
.mf-toggle.on{background:var(--sage);}
.mf-toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s var(--ease);}
.mf-toggle.on::after{left:22px;}
.mf-label{font-size:13px;color:var(--cream);flex:1;}
.mf-type{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0;}
.mf-type-c{background:rgba(122,184,138,.12);color:var(--sage);}
.mf-type-ce{background:rgba(232,132,90,.1);color:var(--copper);}
.shop-section{margin-bottom:6px;}
.shop-cat-lbl{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:14px 0 8px;}
.shop-list{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;}
.shop-item{display:flex;align-items:center;gap:13px;padding:11px 15px;cursor:pointer;border-bottom:1px solid var(--line);transition:.13s;}
.shop-item:last-child{border-bottom:none;}
.shop-item:active{background:var(--card2);}
.s-check{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s var(--ease);}
.shop-item.ck .s-check{background:var(--sage);border-color:var(--sage);}
.s-check-mark{display:none;}
.shop-item.ck .s-check-mark{display:block;font-size:11px;color:#0d0f0e;font-weight:800;}
.s-info{flex:1;min-width:0;}
.s-name{font-size:13px;color:var(--cream);transition:.13s;line-height:1.3;}
.shop-item.ck .s-name{color:var(--muted);text-decoration:line-through;}
.s-qty{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;}
.reset-btn{width:100%;padding:13px;border-radius:var(--r);border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:13px;font-weight:600;margin-top:10px;transition:.15s;}
.reset-btn:active{background:var(--card2);}
/* PREP */
.prep-day{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.prep-day-hdr{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.prep-day-title{font-size:14px;font-weight:700;color:var(--cream);}
.prep-day-meta{font-size:12px;color:var(--muted);margin-top:1px;}
.prep-day-pct{font-size:13px;font-weight:800;color:var(--sage);flex-shrink:0;}
.prep-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.13s;}
.prep-item:last-child{border-bottom:none;}
.prep-item:active{background:var(--card2);}
.prep-ico{font-size:18px;flex-shrink:0;padding-top:1px;}
.prep-txt{flex:1;font-size:13px;color:var(--cream);line-height:1.5;transition:.13s;}
.prep-item.ck .prep-txt{color:var(--muted);text-decoration:line-through;}
.prep-chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s var(--ease);margin-top:1px;}
.prep-item.ck .prep-chk{background:var(--sage);border-color:var(--sage);}
.prep-chk-mark{display:none;font-size:10px;color:#0d0f0e;font-weight:800;}
.prep-item.ck .prep-chk-mark{display:block;}
/* SHEET */
.overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s var(--ease);}
.overlay.show{background:rgba(0,0,0,.65);pointer-events:all;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:400;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line2);max-height:92dvh;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s var(--spring);overflow:hidden;}
.sheet.open{transform:translateY(0);}
.sheet-handle-wrap{flex-shrink:0;padding:12px 0 4px;display:flex;justify-content:center;cursor:pointer;}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--line2);}
.sheet-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 22px 48px;}
.sheet-eyebrow{margin-bottom:10px;}
.sheet-title{font-family:'DM Serif Display',serif;font-size:26px;line-height:1.15;color:var(--cream);margin-bottom:6px;letter-spacing:-.3px;}
.sheet-tagline{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:18px;}
.sheet-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.sh-chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;}
.sh-chip.prot{background:var(--sage-bg);color:var(--sage);border:1px solid var(--sage-br);}
.sh-chip.kcal{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(212,168,67,.2);}
.sh-chip.time{background:var(--copper-bg);color:var(--copper);border:1px solid var(--copper-br);}
.sh-chip.easy{background:rgba(200,192,174,.06);color:var(--cream2);border:1px solid var(--line2);}
.sh-divider{height:1px;background:var(--line);margin:20px 0;}
.sh-section-title{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.ingredient-list{display:flex;flex-direction:column;gap:4px;margin-bottom:4px;}
.ingredient{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--rs);background:var(--card);border:1px solid var(--line);}
.ing-dot{width:6px;height:6px;border-radius:50%;background:var(--copper);flex-shrink:0;}
.ing-name{flex:1;font-size:13px;color:var(--cream);}
.ing-qty{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;}
.steps-list{display:flex;flex-direction:column;gap:10px;}
.step-row{display:flex;gap:14px;align-items:flex-start;}
.step-num-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--copper-bg);border:1px solid var(--copper-br);color:var(--copper);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.step-connector{width:1px;flex:1;min-height:14px;background:var(--line);margin-top:4px;}
.step-body{flex:1;padding-bottom:6px;}
.step-title{font-size:13px;font-weight:700;color:var(--cream);margin-bottom:2px;}
.step-desc{font-size:13px;color:var(--muted);line-height:1.5;}
.prep-note{background:var(--gold-bg);border:1px solid rgba(212,168,67,.2);border-radius:var(--rs);padding:13px 14px;display:flex;gap:10px;align-items:flex-start;margin-top:4px;}
.prep-note-ico{font-size:16px;flex-shrink:0;}
.prep-note-txt{font-size:13px;color:var(--cream);line-height:1.5;}
.prep-note-txt b{color:var(--gold);}
.btn-detail{width:100%;padding:15px;border-radius:var(--r);border:none;background:var(--copper);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:20px;transition:.15s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-detail:active{opacity:.85;transform:scale(.98);}
/* DETAIL OVERLAY */
.detail-overlay{position:fixed;inset:0;z-index:500;background:var(--ink);transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column;overflow:hidden;}
.detail-overlay.open{transform:translateX(0);}
.detail-hdr{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--ink);}
.detail-back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;color:var(--cream);transition:.15s;}
.detail-back:active{background:var(--card2);}
.detail-hdr-label{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.detail-hdr-name{font-size:14px;font-weight:700;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detail-prog-wrap{flex-shrink:0;padding:0 18px;background:var(--ink);transition:all .3s var(--ease);max-height:0;overflow:hidden;}
.detail-prog-wrap.show{max-height:40px;padding:8px 18px;border-bottom:1px solid var(--line);}
.detail-prog-bar{background:var(--line);border-radius:3px;height:4px;}
.detail-prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--copper),var(--sage));transition:width .4s var(--ease);}
.detail-prog-label{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--muted);margin-top:4px;}
.detail-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 0 60px;}
.detail-hero{padding:28px 20px 24px;text-align:center;border-bottom:1px solid var(--line);}
.detail-emoji{font-size:52px;line-height:1;margin-bottom:14px;}
.detail-hero-title{font-family:'DM Serif Display',serif;font-size:28px;line-height:1.15;color:var(--cream);margin-bottom:8px;letter-spacing:-.3px;}
.detail-hero-tagline{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:16px;}
.detail-hero-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.detail-steps-wrap{padding:24px 20px 0;}
.detail-step{display:flex;gap:16px;position:relative;}
.detail-step-left{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.detail-step-num{width:32px;height:32px;border-radius:50%;background:var(--copper-bg);border:1.5px solid var(--copper-br);color:var(--copper);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s var(--spring);flex-shrink:0;position:relative;z-index:1;}
.detail-step.done .detail-step-num{background:var(--copper);border-color:var(--copper);color:#fff;transform:scale(1.05);}
.detail-step-line{width:1px;flex:1;background:var(--line);margin:6px 0;min-height:20px;}
.detail-step:last-child .detail-step-line{display:none;}
.detail-step-body{flex:1;padding-bottom:24px;}
.detail-step-title{font-size:15px;font-weight:700;color:var(--cream);margin-bottom:6px;transition:.2s;line-height:1.3;}
.detail-step.done .detail-step-title{color:var(--muted);text-decoration:line-through;}
.detail-step-desc{font-size:13px;color:var(--muted);line-height:1.65;transition:.2s;}
.detail-step.done .detail-step-desc{opacity:.5;}
.detail-tip{background:var(--gold-bg);border:1px solid rgba(212,168,67,.2);border-radius:var(--rs);padding:12px 13px;display:flex;gap:9px;align-items:flex-start;margin-top:10px;}
.detail-tip-ico{font-size:14px;flex-shrink:0;}
.detail-tip-txt{font-size:12px;color:var(--cream2);line-height:1.55;}
.detail-tip-txt b{color:var(--gold);}
/* MODE */
.mode-modal-overlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.82);display:flex;align-items:flex-end;justify-content:center;}
.mode-modal-overlay.hidden{display:none;}
.mode-modal{background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line2);padding:28px 24px max(28px,env(safe-area-inset-bottom));width:100%;max-width:520px;animation:modeSlide .32s var(--spring) both;}
@keyframes modeSlide{from{transform:translateY(100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
.mode-modal-title{font-family:'DM Serif Display',serif;font-size:24px;color:var(--cream);letter-spacing:-.3px;margin-bottom:6px;}
.mode-modal-sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:22px;}
.mode-options{display:flex;flex-direction:column;gap:10px;}
.mode-btn{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line2);cursor:pointer;transition:.18s var(--ease);text-align:left;width:100%;}
.mode-btn:active{transform:scale(.98);}
.mode-btn.sel{border-color:var(--copper);background:var(--copper-bg);}
.mode-btn-icon{font-size:26px;flex-shrink:0;width:44px;height:44px;background:var(--card2);border-radius:12px;display:flex;align-items:center;justify-content:center;}
.mode-btn.sel .mode-btn-icon{background:var(--copper-bg);}
.mode-btn-body{flex:1;}
.mode-btn-name{font-size:15px;font-weight:700;color:var(--cream);margin-bottom:2px;}
.mode-btn-desc{font-size:12px;color:var(--muted);line-height:1.4;}
.mode-btn-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s var(--ease);}
.mode-btn.sel .mode-btn-check{background:var(--copper);border-color:var(--copper);}
.mode-btn.sel .mode-btn-check::after{content:'✓';font-size:11px;color:#fff;font-weight:800;}
.mode-confirm{margin-top:16px;width:100%;padding:15px;border-radius:var(--r);background:var(--copper);border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.15s var(--ease);font-family:inherit;}
.mode-confirm:active{transform:scale(.98);opacity:.9;}
.mode-pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--copper-bg);border:1px solid var(--copper-br);color:var(--copper);cursor:pointer;transition:.15s var(--ease);white-space:nowrap;}
.mode-pill:active{opacity:.8;}
.info-banner{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;}
.ib-icon{font-size:18px;flex-shrink:0;}
.ib-body{flex:1;}
.ib-title{font-size:13px;font-weight:700;color:var(--cream);margin-bottom:2px;}
.ib-text{font-size:12px;color:var(--muted);line-height:1.5;}
.ib-text b{color:var(--copper);}
</style>

function initMealActive(){
  var changed=false;
  var days=[0,1,2,3,4,5,6];
  var tipos=['comida','cena'];
  for(var di=0;di<days.length;di++){
    for(var ti=0;ti<tipos.length;ti++){

      if(typeof mealActive[key]==='undefined'){mealActive[key]=true;changed=true;}

}

  if(factor===1) return qStr;
  if(!qStr||qStr==='al gusto'||qStr==='abundante'||qStr==='pizca'||qStr==='un puñado'||qStr==='múltiples'||qStr==='para servir'||qStr==='para acompañar') return qStr;
  var rest=qStr.trim();var numPart=0;
  var mixed=rest.match(/^(\d+)(½|¼|¾)/);
  if(mixed){numPart=parseInt(mixed[1])+FRACS[mixed[2]];rest=rest.slice(mixed[0].length).trim();}
  else{
    var frac=rest.match(/^(½|¼|¾)/);
    if(frac){numPart=FRACS[frac[1]];rest=rest.slice(frac[0].length).trim();}
    else{
      var num=rest.match(/^(\d+\.?\d*)/);
      if(!num) return qStr;
      numPart=parseFloat(num[1]);rest=rest.slice(num[0].length).trim();
    }
  }
  var scaled=numPart*factor;var formatted;
  if(Math.abs(scaled-Math.round(scaled))<0.01){formatted=String(Math.round(scaled));}
  else if(Math.abs(scaled-0.5)<0.01){formatted='½';}
  else if(Math.abs(scaled-0.25)<0.01){formatted='¼';}
  else if(Math.abs(scaled-0.75)<0.01){formatted='¾';}
  else if(Math.abs(scaled-1.5)<0.01){formatted='1½';}
  else{formatted=(Math.round(scaled*10)/10).toString();}
  return formatted+(rest?' '+rest:'');
}
function getFactors(){
  if(currentMode==='two') return{c:1,ce:1};
  if(currentMode==='one') return{c:0.5,ce:0.5};
  if(currentMode==='mixed') return{c:0.5,ce:1};
  return{c:1,ce:1};
}
function persLabel(mealType){
  var f=getFactors();var factor=mealType==='cena'?f.ce:f.c;
  return factor===1?'2 personas':'1 persona';
}
function scaleStat(val,mealType){
  var f=getFactors();var factor=mealType==='cena'?f.ce:f.c;
  return Math.round(val*factor);
}

  var allItems=[];

    for(var ii=0;ii<items.length;ii++){
      var item=items[ii];
      var show=true;
      if(item.recetas&&item.recetas.length>0){
        show=false;
        for(var ri=0;ri<item.recetas.length;ri++){
          if(activeRec[item.recetas[ri]]){show=true;break;}

      if(show) allItems.push({item:item,cat:cats[ci],localIdx:ii,catIdx:ci});

  var globalIdx=0;

    html+='<div class="meal-filter-day">'+
      '<div class="meal-filter-day-name">'+DAYS_L[d]+'</div>'+

        '<div class="mf-type mf-type-c">Comida</div>'+
      '</div>'+
      '<div class="meal-filter-row" onclick="toggleMeal('+d+',\'cena\')">'+
        '<div class="mf-toggle'+(mealActive[d+'_cena']!==false?' on':'')+'"></div>'+
        '<div class="mf-label">'+m.cena.icon+' '+m.cena.name+'</div>'+
        '<div class="mf-type mf-type-ce">Cena</div>'+
      '</div>'+
    '</div>';
  }
  html+='</div></div>';
  /* lista por categoría */
  var globalCounter=0;
  for(var ci=0;ci<cats.length;ci++){
    var cat=cats[ci];var items=SHOP[cat];
    var catItems=[];
    for(var ii=0;ii<items.length;ii++){
      var item=items[ii];var show=true;
      if(item.recetas&&item.recetas.length>0){
        show=false;
        for(var ri=0;ri<item.recetas.length;ri++){if(activeRec[item.recetas[ri]]){show=true;break;}}
      }
      if(show) catItems.push({item:item,gk:'g'+ci+'_'+ii});
    }
    if(catItems.length===0) continue;
    html+='<div class="shop-section"><div class="shop-cat-lbl">'+cat+'</div><div class="shop-list">';
    for(var ji=0;ji<catItems.length;ji++){
      var ci2=catItems[ji];var gk=ci2.gk;
      html+='<div class="shop-item '+(shopCk[gk]?'ck':'')+'" onclick="ckShop(\''+gk+'\')">'+
        '<div class="s-check"><span class="s-check-mark">✓</span></div>'+
        '<div class="s-info"><span class="s-name">'+ci2.item.n+'</span></div>'+
        '<span class="s-qty">'+ci2.item.q+'</span>'+
        '</div>';
    }
    html+='</div></div>';
  }
  html+='<button class="reset-btn" onclick="clearShop()">↺ Reiniciar lista de la compra</button>';
  document.getElementById('vcompra').innerHTML=html;
}
function ckShop(gk){
  shopCk[gk]=!shopCk[gk];
  localStorage.setItem('mesa_shop',JSON.stringify(shopCk));
  renderCompra();
}
function clearShop(){shopCk={};localStorage.setItem('mesa_shop','{}');renderCompra();}

/* ═══════════════════════════════════════
   VIEW: PREP
═══════════════════════════════════════ */
function renderPrep(){
  var html='<div class="info-banner"><div class="ib-icon">🔪</div><div class="ib-body"><div class="ib-title">Prep del domingo</div><div class="ib-text">1 hora mientras las costillas están en el horno. El resto de la semana cocinas en 15 min.</div></div></div>';
  for(var pi=0;pi<PREP_DAYS.length;pi++){
    var pd=PREP_DAYS[pi];var items=pd.items;var done=0;
    for(var ii=0;ii<items.length;ii++){if(prepCk[pi+'_'+ii]) done++;}
    var pct=Math.round(done/items.length*100);
    html+='<div class="prep-day"><div class="prep-day-hdr"><div><div class="prep-day-title">'+pd.day+'</div><div class="prep-day-meta">'+pd.meta+'</div></div><div class="prep-day-pct">'+pct+'%</div></div>';
    for(var ii=0;ii<items.length;ii++){
      var it=items[ii];var key=pi+'_'+ii;
      html+='<div class="prep-item '+(prepCk[key]?'ck':'')+'" onclick="ckPrep('+pi+','+ii+')"><div class="prep-ico">'+it.ico+'</div><div class="prep-txt">'+it.txt+'</div><div class="prep-chk"><span class="prep-chk-mark">✓</span></div></div>';
    }
    html+='</div>';
  }
  html+='<div class="sec-head">Conservación</div><div class="prep-day">'+
    '<div class="prep-item"><div class="prep-ico">🧊</div><div class="prep-txt"><b style="color:var(--cream)">Arroz cocido.</b> Tupper en nevera 4-5 días. 2 min al micro con agua para calentar.</div><div class="prep-chk" style="visibility:hidden"></div></div>'+
    '<div class="prep-item"><div class="prep-ico">🥚</div><div class="prep-txt"><b style="color:var(--cream)">Huevos melosos.</b> Sin pelar en nevera hasta 3 días. No más o la yema se endurece.</div><div class="prep-chk" style="visibility:hidden"></div></div>'+
    '<div class="prep-item"><div class="prep-ico">🥑</div><div class="prep-txt"><b style="color:var(--cream)">Guacamole.</b> Film pegado a la superficie, nevera 2 días máximo. El aguacate oxidado, rasca la capa marrón y debajo está verde.</div><div class="prep-chk" style="visibility:hidden"></div></div>'+
    '<div class="prep-item"><div class="prep-ico">🍅</div><div class="prep-txt"><b style="color:var(--cream)">Pico de gallo.</b> Tupper en nevera 3-4 días. Con el tiempo el tomate suelta agua, normal.</div><div class="prep-chk" style="visibility:hidden"></div></div>'+
    '<div class="prep-item"><div class="prep-ico">🍗</div><div class="prep-txt"><b style="color:var(--cream)">Pollo marinado.</b> En nevera máximo 2 días. No más o la textura cambia.</div><div class="prep-chk" style="visibility:hidden"></div></div>'+
    '</div>'+
    '<button class="reset-btn" onclick="clearPrep()">↺ Reiniciar preparación</button>';
  document.getElementById('vprep').innerHTML=html;
}
function ckPrep(pd,i){var key=pd+'_'+i;prepCk[key]=!prepCk[key];localStorage.setItem('mesa_prep',JSON.stringify(prepCk));renderPrep();}
function clearPrep(){prepCk={};localStorage.setItem('mesa_prep','{}');renderPrep();}

/* ═══════════════════════════════════════
   NAVEGACIÓN
═══════════════════════════════════════ */
function goTab(name,btn){
  var views=document.querySelectorAll('.view');for(var i=0;i<views.length;i++) views[i].classList.remove('on');
  var tabs=document.querySelectorAll('.tab');for(var i=0;i<tabs.length;i++) tabs[i].classList.remove('on');
  document.getElementById('v'+name).classList.add('on');btn.classList.add('on');
  if(name==='semana') renderSemana();
  if(name==='compra') renderCompra();
  if(name==='prep') renderPrep();
  if(name==='hoy'){renderHoy();buildStrip();}
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
buildStrip();updateModePill();
if(!localStorage.getItem('mesa_mode')){pendingMode='two';renderModeOptions();document.getElementById('modeOverlay').classList.remove('hidden');}
renderHoy();
setInterval(function(){var v=document.querySelector('.view.on');if(v&&v.id==='vhoy') renderHoy();},60000);
</script>
