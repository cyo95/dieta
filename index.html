<script>
(function(){
  var c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  var ctx = c.getContext('2d');
  var r = 100;
  ctx.beginPath();
  ctx.moveTo(r,0); ctx.lineTo(512-r,0);
  ctx.quadraticCurveTo(512,0,512,r);
  ctx.lineTo(512,512-r);
  ctx.quadraticCurveTo(512,512,512-r,512);
  ctx.lineTo(r,512);
  ctx.quadraticCurveTo(0,512,0,512-r);
  ctx.lineTo(0,r);
  ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();
  var grad = ctx.createLinearGradient(0,0,512,512);
  grad.addColorStop(0,'#1c2119');
  grad.addColorStop(1,'#0d0f0e');
  ctx.fillStyle = grad;
  ctx.fill();
  var cu = '#e8845a';
  ctx.strokeStyle = cu;
  ctx.fillStyle   = cu;
  ctx.lineCap = 'round';
  ctx.lineWidth = 20;
  [170,210,250].forEach(function(x){
    ctx.beginPath(); ctx.moveTo(x,108); ctx.lineTo(x,210); ctx.stroke();
  });
  ctx.beginPath();
  ctx.moveTo(170,210);
  ctx.quadraticCurveTo(170,240,210,250);
  ctx.quadraticCurveTo(250,240,250,210);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(210,250); ctx.lineTo(210,400); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(300,108); ctx.lineTo(300,230); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(300,108);
  ctx.bezierCurveTo(340,108,350,180,300,230);
  ctx.fillStyle = cu;
  ctx.fill();
  ctx.strokeStyle = cu;
  ctx.beginPath(); ctx.moveTo(300,230); ctx.lineTo(300,400); ctx.stroke();
  ctx.beginPath(); ctx.arc(256,446,10,0,Math.PI*2);
  ctx.fillStyle = cu; ctx.globalAlpha=0.4; ctx.fill(); ctx.globalAlpha=1;
  var png = c.toDataURL('image/png');
  var link = document.createElement('link');
  link.rel = 'apple-touch-icon'; link.href = png;
  document.head.appendChild(link);
  var fav = document.createElement('link');
  fav.rel = 'icon'; fav.type = 'image/png'; fav.href = png;
  document.head.appendChild(fav);
})();
</script>

<style>
/* ══════════════════════════════════════════════
   TOKENS
══════════════════════════════════════════════ */
:root {
  --ink:       #0d0f0e;
  --surface:   #141714;
  --card:      #1b1f1b;
  --card2:     #222622;
  --line:      #2a302a;
  --line2:     #333b33;
  --copper:    #e8845a;
  --copper-d:  #b85e38;
  --copper-bg: rgba(232,132,90,.1);
  --copper-br: rgba(232,132,90,.22);
  --sage:      #7ab88a;
  --sage-bg:   rgba(122,184,138,.1);
  --sage-br:   rgba(122,184,138,.22);
  --cream:     #f0ead8;
  --cream2:    #c8c0ae;
  --muted:     #7a8479;
  --gold:      #d4a843;
  --gold-bg:   rgba(212,168,67,.1);
  --r:         16px;
  --rs:        10px;
  --rx:        22px;
  --ease:      cubic-bezier(.32,0,.18,1);
  --spring:    cubic-bezier(.34,1.56,.64,1);
}

/* ══════════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  height: 100%; overflow: hidden;
  background: var(--ink);
  color: var(--cream);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; }

/* ══════════════════════════════════════════════
   LAYOUT SHELL
══════════════════════════════════════════════ */
.shell {
  display: flex; flex-direction: column;
  height: 100dvh; height: 100vh;
  overflow: hidden; position: relative;
}

/* ── HEADER ─────────────────────────────────── */
.hdr {
  flex-shrink: 0;
  padding: 14px 20px 0;
  background: var(--ink);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 10;
}
.hdr-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 17px; color: var(--cream);
  letter-spacing: -.3px; text-decoration: none;
}
.logo span { color: var(--copper); }
.hdr-right { display: flex; align-items: center; gap: 10px; }
.clock-pill {
  font-size: 12px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--copper);
  background: var(--copper-bg);
  border: 1px solid var(--copper-br);
  padding: 4px 11px; border-radius: 20px;
  letter-spacing: .3px;
}

/* day strip */
.day-strip {
  display: flex; gap: 4px;
  overflow-x: auto; scrollbar-width: none;
  padding-bottom: 14px;
}
.day-strip::-webkit-scrollbar { display: none; }
.dp {
  flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 7px 10px; border-radius: var(--rs);
  border: 1.5px solid transparent;
  background: transparent; color: var(--muted);
  font-size: 11px; font-weight: 700; letter-spacing: .4px;
  text-transform: uppercase; transition: .18s var(--ease);
  min-width: 44px;
}
.dp .dnum {
  font-size: 15px; font-weight: 800; color: var(--muted);
  line-height: 1; font-variant-numeric: tabular-nums;
}
.dp.today { color: var(--copper); }
.dp.today .dnum { color: var(--copper); }
.dp.sel {
  background: var(--copper-bg);
  border-color: var(--copper-br);
  color: var(--copper);
}
.dp.sel .dnum { color: var(--cream); }

/* ── TABS ────────────────────────────────────── */
.tabs {
  flex-shrink: 0;
  display: flex; gap: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 10;
}
.tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px;
  padding: 10px 4px 8px;
  color: var(--muted); font-size: 10px; font-weight: 700;
  letter-spacing: .4px; text-transform: uppercase;
  border-bottom: 2px solid transparent;
  transition: .15s var(--ease);
}
.tab .ticon { font-size: 18px; line-height: 1; }
.tab.on { color: var(--copper); border-bottom-color: var(--copper); }

/* ── CONTENT SCROLL ──────────────────────────── */
.content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  position: relative;
}

/* ══════════════════════════════════════════════
   VIEWS
══════════════════════════════════════════════ */
.view { display: none; padding: 20px 20px 48px; }
.view.on { display: block; animation: fadeSlide .22s var(--ease) both; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════════════════════
   HOY VIEW
══════════════════════════════════════════════ */
.now-card {
  background: var(--card);
  border: 1px solid var(--line2);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 20px;
  position: relative; overflow: hidden;
}
.now-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--copper), transparent 70%);
}
.now-eyebrow {
  font-size: 10px; font-weight: 800; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--copper);
  margin-bottom: 7px;
}
.now-title {
  font-family: 'DM Serif Display', serif;
  font-size: 24px; line-height: 1.15; letter-spacing: -.3px;
  color: var(--cream); margin-bottom: 4px;
}
.now-sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.now-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.ntag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px;
}
.ntag-copper { background: var(--copper-bg); color: var(--copper); border: 1px solid var(--copper-br); }
.ntag-sage   { background: var(--sage-bg);   color: var(--sage);   border: 1px solid var(--sage-br); }
.ntag-gold   { background: var(--gold-bg);   color: var(--gold);   border: 1px solid rgba(212,168,67,.2); }

.sec-head {
  font-size: 11px; font-weight: 800; letter-spacing: 1.3px;
  text-transform: uppercase; color: var(--muted);
  margin: 24px 0 12px;
  display: flex; align-items: center; gap: 10px;
}
.sec-head::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.meal-card {
  background: var(--card);
  border: 1px solid var(--line2);
  border-radius: var(--r);
  padding: 0; margin-bottom: 10px;
  overflow: hidden; cursor: pointer;
  transition: .18s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.meal-card:active { transform: scale(.985); opacity: .9; }
.meal-card-inner { padding: 16px 18px; }
.meal-card-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 10px;
  margin-bottom: 10px;
}
.meal-label {
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; padding: 3px 8px;
  border-radius: 8px; display: inline-block;
}
.ml-comida { background: rgba(122,184,138,.12); color: var(--sage); }
.ml-cena   { background: rgba(232,132,90,.1);   color: var(--copper); }
.ml-desay  { background: rgba(212,168,67,.1);   color: var(--gold); }
.meal-name {
  font-family: 'DM Serif Display', serif;
  font-size: 20px; line-height: 1.2; letter-spacing: -.2px;
  color: var(--cream); margin-bottom: 6px;
}
.meal-tagline { font-size: 13px; color: var(--muted); line-height: 1.45; margin-bottom: 12px; }
.meal-footer {
  display: flex; gap: 8px; flex-wrap: wrap;
  align-items: center; justify-content: space-between;
}
.meal-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 20px;
  background: var(--card2); color: var(--muted);
  border: 1px solid var(--line);
}
.chip.prot { color: var(--sage); background: var(--sage-bg); border-color: var(--sage-br); }
.chip.kcal { color: var(--gold); background: var(--gold-bg); border-color: rgba(212,168,67,.2); }
.meal-arrow { font-size: 16px; color: var(--muted); flex-shrink: 0; }
.meal-divider { height: 1px; background: var(--line); }
.meal-prep-strip {
  padding: 10px 18px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
}
.meal-prep-strip .prep-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); flex-shrink: 0;
}

.macro-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; margin-bottom: 20px;
}
.macro-box {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--rs); padding: 12px 8px; text-align: center;
}
.macro-val {
  font-size: 18px; font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums; margin-bottom: 3px;
}
.macro-val.kc { color: var(--gold); }
.macro-val.pr { color: var(--sage); }
.macro-val.ti { color: var(--copper); }
.macro-val.di { color: var(--cream2); }
.macro-lbl {
  font-size: 9px; font-weight: 700; letter-spacing: .6px;
  text-transform: uppercase; color: var(--muted);
}

.bf-grid { display: flex; flex-direction: column; gap: 8px; }
.bf-card {
  background: var(--card);
  border: 1px solid var(--line2);
  border-radius: var(--rs);
  padding: 13px 15px;
  display: flex; gap: 12px; align-items: flex-start;
}
.bf-letter {
  width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
  background: var(--gold-bg); color: var(--gold);
  font-size: 20px; display: flex; align-items: center; justify-content: center;
}
.bf-name { font-size: 14px; font-weight: 700; color: var(--cream); margin-bottom: 3px; }
.bf-items { font-size: 12px; color: var(--muted); line-height: 1.55; }
.bf-detail { font-size: 11px; color: var(--muted); margin-top: 5px; opacity: .8; }
.bf-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }

/* ══════════════════════════════════════════════
   SEMANA VIEW
══════════════════════════════════════════════ */
.week-day {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--r); margin-bottom: 8px; overflow: hidden;
}
.week-day-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; cursor: pointer; transition: .15s;
}
.week-day-hdr:active { background: var(--card2); }
.week-day-name {
  font-size: 14px; font-weight: 700; color: var(--cream);
  display: flex; align-items: center; gap: 8px;
}
.today-badge {
  font-size: 9px; font-weight: 800; letter-spacing: .6px;
  text-transform: uppercase;
  background: var(--copper); color: #fff;
  padding: 2px 7px; border-radius: 8px;
}
.week-day-arrow {
  font-size: 14px; color: var(--muted);
  transition: transform .2s var(--ease);
}
.week-day.open .week-day-arrow { transform: rotate(90deg); }
.week-day-body { display: none; }
.week-day.open .week-day-body { display: block; }
.week-meal-row {
  display: flex; gap: 10px; align-items: center;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  cursor: pointer; transition: .15s;
}
.week-meal-row:active { background: var(--card2); }
.wm-icon { font-size: 20px; flex-shrink: 0; }
.wm-info { flex: 1; }
.wm-type {
  font-size: 9px; font-weight: 800; letter-spacing: .8px;
  text-transform: uppercase; margin-bottom: 2px;
}
.wm-type.c  { color: var(--sage); }
.wm-type.ce { color: var(--copper); }
.wm-name { font-size: 13px; font-weight: 600; color: var(--cream); line-height: 1.3; }
.wm-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.wm-arrow { font-size: 14px; color: var(--line2); }

/* ══════════════════════════════════════════════
   COMPRA VIEW
══════════════════════════════════════════════ */
.shop-top {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--r); padding: 16px; margin-bottom: 14px;
}
.shop-top-title { font-size: 16px; font-weight: 700; color: var(--cream); margin-bottom: 4px; }
.shop-top-sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.prog-wrap { background: var(--line); border-radius: 3px; height: 4px; }
.prog-fill {
  height: 100%; border-radius: 3px;
  background: var(--sage);
  transition: width .4s var(--ease);
}
.prog-label {
  font-size: 11px; font-weight: 700; color: var(--sage);
  margin-top: 6px; text-align: right;
  font-variant-numeric: tabular-nums;
}
.shop-section { margin-bottom: 6px; }
.shop-cat-lbl {
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; color: var(--muted);
  padding: 14px 0 8px;
}
.shop-list {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--r); overflow: hidden;
}
.shop-item {
  display: flex; align-items: center; gap: 13px;
  padding: 11px 15px; cursor: pointer;
  border-bottom: 1px solid var(--line);
  transition: .13s;
}
.shop-item:last-child { border-bottom: none; }
.shop-item:active { background: var(--card2); }
.s-check {
  width: 21px; height: 21px; border-radius: 50%;
  border: 1.5px solid var(--line2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: .15s var(--ease);
}
.shop-item.ck .s-check { background: var(--sage); border-color: var(--sage); }
.s-check-mark { display: none; }
.shop-item.ck .s-check-mark { display: block; font-size: 11px; color: #0d0f0e; font-weight: 800; }
.s-info { flex: 1; min-width: 0; }
.s-name {
  font-size: 13px; color: var(--cream);
  transition: .13s; line-height: 1.3;
}
.shop-item.ck .s-name { color: var(--muted); text-decoration: line-through; }
.uso-badge {
  display: inline-block;
  font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 5px;
  margin-left: 5px; white-space: nowrap;
  vertical-align: middle;
}
.uso-green  { background: rgba(122,184,138,.1);  color: var(--sage); }
.uso-gold   { background: rgba(212,168,67,.1);   color: var(--gold); }
.s-qty { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }
.reset-btn {
  width: 100%; padding: 13px; border-radius: var(--r);
  border: 1px solid var(--line2); background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 600;
  margin-top: 10px; transition: .15s;
}
.reset-btn:active { background: var(--card2); }

/* ══════════════════════════════════════════════
   PREP VIEW
══════════════════════════════════════════════ */
.prep-day {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--r); margin-bottom: 10px; overflow: hidden;
}
.prep-day-hdr {
  padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.prep-day-title { font-size: 14px; font-weight: 700; color: var(--cream); }
.prep-day-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
.prep-day-pct { font-size: 13px; font-weight: 800; color: var(--sage); flex-shrink: 0; }
.prep-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
  cursor: pointer; transition: .13s;
}
.prep-item:last-child { border-bottom: none; }
.prep-item:active { background: var(--card2); }
.prep-ico { font-size: 18px; flex-shrink: 0; padding-top: 1px; }
.prep-txt { flex: 1; font-size: 13px; color: var(--cream); line-height: 1.5; transition: .13s; }
.prep-item.ck .prep-txt { color: var(--muted); text-decoration: line-through; }
.prep-chk {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--line2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: .15s var(--ease); margin-top: 1px;
}
.prep-item.ck .prep-chk { background: var(--sage); border-color: var(--sage); }
.prep-chk-mark { display: none; font-size: 10px; color: #0d0f0e; font-weight: 800; }
.prep-item.ck .prep-chk-mark { display: block; }

/* ══════════════════════════════════════════════
   SHEET (PANEL INFERIOR)
══════════════════════════════════════════════ */
.overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0);
  pointer-events: none;
  transition: background .3s var(--ease);
}
.overlay.show { background: rgba(0,0,0,.65); pointer-events: all; }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 400;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--line2);
  max-height: 92dvh; max-height: 92vh;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform .38s var(--spring);
  overflow: hidden;
}
.sheet.open { transform: translateY(0); }
.sheet-handle-wrap {
  flex-shrink: 0; padding: 12px 0 4px;
  display: flex; justify-content: center; cursor: pointer;
}
.sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--line2); }
.sheet-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 4px 22px 48px;
}
.sheet-eyebrow { margin-bottom: 10px; }
.sheet-title {
  font-family: 'DM Serif Display', serif;
  font-size: 26px; line-height: 1.15; color: var(--cream);
  margin-bottom: 6px; letter-spacing: -.3px;
}
.sheet-tagline { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
.sheet-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.sh-chip {
  font-size: 12px; font-weight: 700;
  padding: 5px 12px; border-radius: 20px;
}
.sh-chip.prot { background: var(--sage-bg); color: var(--sage); border: 1px solid var(--sage-br); }

  background: var(--gold-bg);
  border: 1px solid rgba(212,168,67,.2);

  margin-top: 4px;
}

.prep-note-txt { font-size: 13px; color: var(--cream); line-height: 1.5; }

/* Ver receta completa button */
.btn-detail {
  width: 100%; padding: 15px;
  border-radius: var(--r); border: none;
  background: var(--copper); color: #fff;

  font-family: inherit; cursor: pointer;

══════════════════════════════════════════════ */
.detail-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: var(--ink);
  transform: translateX(100%);
  transition: transform .35s var(--ease);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.detail-overlay.open { transform: translateX(0); }

.detail-hdr {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--ink);
}
.detail-back {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--line2);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; flex-shrink: 0;
  color: var(--cream); transition: .15s;
}
.detail-back:active { background: var(--card2); }
.detail-hdr-label {
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 2px;
}
.detail-hdr-name {
  font-size: 14px; font-weight: 700; color: var(--cream);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* progress bar for detail */
.detail-prog-wrap {
  flex-shrink: 0;
  padding: 0 18px;
  background: var(--ink);
  transition: all .3s var(--ease);
  max-height: 0; overflow: hidden;
}
.detail-prog-wrap.show {
  max-height: 40px;
  padding: 8px 18px;
  border-bottom: 1px solid var(--line);
}
.detail-prog-bar { background: var(--line); border-radius: 3px; height: 4px; }
.detail-prog-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--copper), var(--sage));

}
.detail-prog-label {
  display: flex; justify-content: space-between;
  font-size: 10px; font-weight: 700; color: var(--muted);
  margin-top: 4px;
}

.detail-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 0 0 60px;
}

/* hero section */
.detail-hero {
  padding: 28px 20px 24px;
  text-align: center;
  border-bottom: 1px solid var(--line);
}
.detail-emoji { font-size: 52px; line-height: 1; margin-bottom: 14px; }
.detail-hero-title {
  font-family: 'DM Serif Display', serif;
  font-size: 28px; line-height: 1.15; color: var(--cream);
  margin-bottom: 8px; letter-spacing: -.3px;
}
.detail-hero-tagline { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }
.detail-hero-chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

/* detail steps */
.detail-steps-wrap { padding: 24px 20px 0; }
.detail-step {
  display: flex; gap: 16px; margin-bottom: 0;
  position: relative;
}
.detail-step-left { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.detail-step-num {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--copper-bg); border: 1.5px solid var(--copper-br);
  color: var(--copper); font-size: 12px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: .2s var(--spring); flex-shrink: 0;
  position: relative; z-index: 1;
}
.detail-step.done .detail-step-num {
  background: var(--copper); border-color: var(--copper);
  color: #fff; transform: scale(1.05);
}
.detail-step-line {
  width: 1px; flex: 1; background: var(--line);
  margin: 6px 0; min-height: 20px;
}
.detail-step:last-child .detail-step-line { display: none; }
.detail-step-body {
  flex: 1; padding-bottom: 24px;
}
.detail-step-title {
  font-size: 15px; font-weight: 700; color: var(--cream);
  margin-bottom: 6px; transition: .2s;
  line-height: 1.3;
}
.detail-step.done .detail-step-title { color: var(--muted); text-decoration: line-through; }
.detail-step-desc {
  font-size: 13px; color: var(--muted); line-height: 1.65;
  transition: .2s;
}
.detail-step.done .detail-step-desc { opacity: .5; }
.detail-tip {
  background: var(--gold-bg);
  border: 1px solid rgba(212,168,67,.2);

  margin-top: 10px;
}
.detail-tip-ico { font-size: 14px; flex-shrink: 0; }
.detail-tip-txt { font-size: 12px; color: var(--cream2); line-height: 1.55; }
.detail-tip-txt b { color: var(--gold); }

/* ══════════════════════════════════════════════
   MODE SELECTOR
══════════════════════════════════════════════ */
.mode-modal-overlay {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(0,0,0,.82);
  display: flex; align-items: flex-end;
  justify-content: center;
}
.mode-modal-overlay.hidden { display: none; }
.mode-modal {
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--line2);
  padding: 28px 24px max(28px, env(safe-area-inset-bottom));
  width: 100%; max-width: 520px;
  animation: modeSlide .32s var(--spring) both;
}
@keyframes modeSlide {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.mode-modal-title {
  font-family: 'DM Serif Display', serif;
  font-size: 24px; color: var(--cream);
  letter-spacing: -.3px; margin-bottom: 6px;
}
.mode-modal-sub { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 22px; }
.mode-options { display: flex; flex-direction: column; gap: 10px; }
.mode-btn {
  display: flex; align-items: center; gap: 14px;
  padding: 16px; border-radius: var(--r);
  background: var(--card); border: 1.5px solid var(--line2);
  cursor: pointer; transition: .18s var(--ease);
  text-align: left; width: 100%;
}
.mode-btn:active { transform: scale(.98); }
.mode-btn.sel { border-color: var(--copper); background: var(--copper-bg); }
.mode-btn-icon {
  font-size: 26px; flex-shrink: 0;
  width: 44px; height: 44px;
  background: var(--card2); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}
.mode-btn.sel .mode-btn-icon { background: var(--copper-bg); }
.mode-btn-body { flex: 1; }
.mode-btn-name { font-size: 15px; font-weight: 700; color: var(--cream); margin-bottom: 2px; }
.mode-btn-desc { font-size: 12px; color: var(--muted); line-height: 1.4; }
.mode-btn-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid var(--line2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: .15s var(--ease);
}
.mode-btn.sel .mode-btn-check { background: var(--copper); border-color: var(--copper); }
.mode-btn.sel .mode-btn-check::after { content: '✓'; font-size: 11px; color: #fff; font-weight: 800; }
.mode-confirm {
  margin-top: 16px; width: 100%;
  padding: 15px; border-radius: var(--r);
  background: var(--copper); border: none;
  color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: .15s var(--ease);
  font-family: inherit;
}
.mode-confirm:active { transform: scale(.98); opacity: .9; }
.mode-pill {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px;
  background: var(--copper-bg);
  border: 1px solid var(--copper-br);
  color: var(--copper); cursor: pointer;
  transition: .15s var(--ease); white-space: nowrap;
}
.mode-pill:active { opacity: .8; }

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
.info-banner {
  background: var(--card); border: 1px solid var(--line2);

  margin-bottom: 14px;
}
.ib-icon { font-size: 18px; flex-shrink: 0; }

.ib-title { font-size: 13px; font-weight: 700; color: var(--cream); margin-bottom: 2px; }
.ib-text { font-size: 12px; color: var(--muted); line-height: 1.5; }
.ib-text b { color: var(--copper); }

<div class="shell">

  <header class="hdr">

</div>

<!-- MODE SELECTOR -->
<div class="mode-modal-overlay hidden" id="modeOverlay">

</div>

<!-- SHEET OVERLAY -->

</div>

/* ── SCALE HELPERS ─────────────────────── */
var FRACS = {'½':0.5,'¼':0.25,'¾':0.75};
function scaleQty(qStr, factor) {
  if (factor === 1) return qStr;
  if (!qStr || qStr === 'al gusto' || qStr === 'generosa' || qStr === 'pizca' || qStr === 'un puñado') return qStr;
  var rest = qStr.trim();
  var numPart = 0;
  var mixed = rest.match(/^(\d+)(½|¼|¾)/);
  if (mixed) {
    numPart = parseInt(mixed[1]) + FRACS[mixed[2]];
    rest = rest.slice(mixed[0].length).trim();
  } else {
    var frac = rest.match(/^(½|¼|¾)/);
    if (frac) {
      numPart = FRACS[frac[1]];
      rest = rest.slice(frac[0].length).trim();
    } else {
      var num = rest.match(/^(\d+\.?\d*)/);
      if (!num) return qStr;
      numPart = parseFloat(num[1]);
      rest = rest.slice(num[0].length).trim();
    }
  }
  var scaled = numPart * factor;
  var formatted;
  if (Math.abs(scaled - Math.round(scaled)) < 0.01) {
    formatted = String(Math.round(scaled));
  } else if (Math.abs(scaled - 0.5) < 0.01) { formatted = '½';
  } else if (Math.abs(scaled - 0.25) < 0.01) { formatted = '¼';
  } else if (Math.abs(scaled - 0.75) < 0.01) { formatted = '¾';
  } else if (Math.abs(scaled - 1.5) < 0.01) { formatted = '1½';
  } else { formatted = (Math.round(scaled * 10) / 10).toString(); }
  return formatted + (rest ? ' ' + rest : '');
}
function getFactors() {
  if (currentMode === 'two')   return {c:1, ce:1};
  if (currentMode === 'one')   return {c:0.5, ce:0.5};
  if (currentMode === 'mixed') return {c:0.5, ce:1};
  return {c:1, ce:1};
}
function persLabel(mealType) {
  var f = getFactors();
  var factor = mealType === 'cena' ? f.ce : f.c;
  return factor === 1 ? '2 personas' : '1 persona';
}
function scaleStat(val, mealType) {
  var f = getFactors();
  var factor = mealType === 'cena' ? f.ce : f.c;
  return Math.round(val * factor);
}
function scaleShopQty(item) {
  if (currentMode === 'two')   return item.q;
  if (currentMode === 'one')   return scaleQty(item.q, 0.5);
  if (currentMode === 'mixed') return scaleQty(item.q, 0.75);
  return item.q;
}

function toggleStep(idx) {
  if (detailDone[idx]) {
    delete detailDone[idx];
  } else {
    detailDone[idx] = true;
  }
  var stepEl = document.getElementById('dstep' + idx);
  var numEl  = document.getElementById('dnum'  + idx);
  if (detailDone[idx]) {
    stepEl.classList.add('done');
    numEl.textContent = '✓';
  } else {
    stepEl.classList.remove('done');
    numEl.textContent = String(idx + 1);
  }
  updateDetailProgress();
}

function updateDetailProgress() {
  var total = currentDetailSteps.length;
  var done  = Object.keys(detailDone).length;
  var pct   = total > 0 ? Math.round(done / total * 100) : 0;
  var wrap  = document.getElementById('detailProgWrap');
  if (done > 0) { wrap.classList.add('show'); }
  document.getElementById('detailProgFill').style.width = pct + '%';
  document.getElementById('detailProgTxt').textContent =
    done + ' de ' + total + ' paso' + (done !== 1 ? 's' : '') + ' hecho' + (done !== 1 ? 's' : '');
  document.getElementById('detailProgPct').textContent = pct + '%';
}

}

      '<div class="now-eyebrow">⚡ Ahora · ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + '</div>' +
      '<div class="now-title">' + title + '</div>' +
      '<div class="now-sub">' + (bl.type === 'c' ? 'Comida del mediodía' : bl.type === 'ce' ? 'Cena de la noche' : bl.label + ' — ' + dayName) + '</div>' +
      '<div class="now-tags">' + tag + '</div>' +
      '</div>';
  } else if (!isToday) {
    nowHTML = '<div class="now-card">' +
      '<div class="now-eyebrow">📅 Consultando</div>' +
      '<div class="now-title">' + dayName + '</div>' +
      '<div class="now-sub">Aquí tienes el menú de este día.</div>' +
      '</div>';
  } else {
    nowHTML = '<div class="now-card">' +
      '<div class="now-eyebrow">🌙 Buenas noches</div>' +
      '<div class="now-title">Descansa</div>' +
      '<div class="now-sub">Mañana otro día. Si toca, saca algo del congelador.</div>' +
      '</div>';
  }

  /* macros */
  var f = getFactors();
  var totalKcal = Math.round((menu && menu.comida ? menu.comida.kcal : 0) * f.c + (menu && menu.cena ? menu.cena.kcal : 0) * f.ce) + 400;
  var totalProt = Math.round((menu && menu.comida ? menu.comida.prot : 0) * f.c + (menu && menu.cena ? menu.cena.prot : 0) * f.ce) + 22;
  var minsC  = menu && menu.comida ? menu.comida.mins : 0;
  var minsCe = menu && menu.cena   ? menu.cena.mins   : 0;
  var macrosHTML = '<div class="macro-row">' +
    '<div class="macro-box"><div class="macro-val kc">' + totalKcal + '</div><div class="macro-lbl">Kcal</div></div>' +
    '<div class="macro-box"><div class="macro-val pr">' + totalProt + 'g</div><div class="macro-lbl">Prot.</div></div>' +
    '<div class="macro-box"><div class="macro-val ti">' + minsC + '+' + minsCe + '<span style="font-size:11px">m</span></div><div class="macro-lbl">Cocina</div></div>' +
    '<div class="macro-box"><div class="macro-val di">Alta</div><div class="macro-lbl">Saciedad</div></div>' +
    '</div>';

  /* meal cards */
  var mealsHTML = '';
  if (menu) {
    var tipos = ['comida','cena'];
    for (var ti = 0; ti < tipos.length; ti++) {
      var tipo = tipos[ti];
      var r = menu[tipo];
      if (!r) continue;
      var labelClass = tipo === 'comida' ? 'ml-comida' : 'ml-cena';
      var labelTime  = tipo === 'comida' ? '☀️ Comida · 14:00' : '🌙 Cena · 21:00';
      var sp = scaleStat(r.prot, tipo);
      var sk = scaleStat(r.kcal, tipo);
      var prepStrip = r.prepNote ?
        '<div class="meal-divider"></div><div class="meal-prep-strip"><div class="prep-dot"></div>Hay tip de preparación</div>' : '';
      mealsHTML += '<div class="meal-card" onclick="openSheet(' + selDay + ',\'' + tipo + '\')">' +
        '<div class="meal-card-inner">' +
          '<div class="meal-card-top"><span class="meal-label ' + labelClass + '">' + labelTime + '</span></div>' +
          '<div class="meal-name">' + r.icon + ' ' + r.name + '</div>' +
          '<div class="meal-tagline">' + r.tagline + '</div>' +
          '<div class="meal-footer"><div class="meal-chips">' +
            '<span class="chip prot">' + sp + 'g prot.</span>' +
            '<span class="chip kcal">' + sk + ' kcal</span>' +
            '<span class="chip">' + r.mins + ' min</span>' +
          '</div><div class="meal-arrow">›</div></div>' +
        '</div>' + prepStrip + '</div>';
    }
  }

  /* desayunos */
  var bfastsHTML = '<div class="sec-head">Desayuno rápido</div>' +
    '<div class="info-banner" style="margin-bottom:10px;border-color:rgba(212,168,67,.2);background:rgba(212,168,67,.05)">' +
      '<div class="ib-icon">⚡</div>' +
      '<div class="ib-body"><div class="ib-title">Sin prisa por la mañana</div>' +
      '<div class="ib-text">Las comidas de hoy ya están pensadas para compensar. Coge algo rápido y ve.</div></div>' +
    '</div><div class="bf-grid">';
  for (var bi = 0; bi < BFASTS.length; bi++) {
    var bf = BFASTS[bi];
    var bfChips = '';
    for (var ci = 0; ci < bf.chips.length; ci++) {
      bfChips += '<span class="chip ' + bf.chips[ci].cls + '">' + bf.chips[ci].t + '</span>';
    }
    bfastsHTML += '<div class="bf-card">' +
      '<div class="bf-letter">' + bf.id + '</div>' +
      '<div><div class="bf-name">' + bf.label + '</div>' +
      '<div class="bf-items">' + bf.sub + '</div>' +
      '<div class="bf-detail">' + bf.detail + '</div>' +
      '<div class="bf-chips">' + bfChips + '</div></div>' +
      '</div>';
  }
  bfastsHTML += '</div>';

  var mondayAlert = selDay === 1 ?
    '<div class="info-banner" style="border-color:rgba(122,184,138,.25);background:rgba(122,184,138,.06);margin-bottom:12px">' +
    '<div class="ib-icon">🛒</div><div class="ib-body">' +
    '<div class="ib-title">¡Hoy toca la compra semanal!</div>' +
    '<div class="ib-text">Lista completa en la pestaña <b style="color:var(--sage)">Compra</b>. Todo en Mercadona.</div>' +
    '</div></div>' : '';

  var sundayAlert = selDay === 0 ?
    '<div class="info-banner" style="margin-bottom:12px">' +
    '<div class="ib-icon">⏱️</div><div class="ib-body">' +
    '<div class="ib-title">30 minutos de prep ahora = semana tranquila</div>' +
    '<div class="ib-text">Ve a <b>Prep</b> para ver qué hacer hoy y ahorrar tiempo los próximos días.</div>' +
    '</div></div>' : '';

  document.getElementById('vhoy').innerHTML =
    nowHTML + mondayAlert + sundayAlert + macrosHTML +
    '<div class="sec-head">Las comidas de hoy</div>' + mealsHTML + bfastsHTML;
}

/* ════════════════════════════════════════════
   VIEW: SEMANA
════════════════════════════════════════════ */
function renderSemana() {
  var today = new Date().getDay();
  var html = '<div class="info-banner"><div class="ib-icon">💡</div>' +
    '<div class="ib-body"><div class="ib-title">Toca cualquier plato para ver la receta completa</div>' +
    '<div class="ib-text">Ingredientes, pasos y tips sin moverte de aquí.</div></div></div>';

  var order = [1,2,3,4,5,6,0];
  for (var oi = 0; oi < order.length; oi++) {
    var d = order[oi];
    var m = MENU[d];
    var isT = d === today;
    var badge = isT ? '<span class="today-badge">Hoy</span>' : '';
    var sp_c  = scaleStat(m.comida.prot, 'comida');
    var sk_c  = scaleStat(m.comida.kcal, 'comida');
    var sp_ce = scaleStat(m.cena.prot,   'cena');
    var sk_ce = scaleStat(m.cena.kcal,   'cena');
    html += '<div class="week-day' + (isT ? ' open' : '') + '" id="wd' + d + '">' +
      '<div class="week-day-hdr" onclick="toggleWkDay(' + d + ')">' +
        '<div class="week-day-name">' + DAYS_L[d] + badge + '</div>' +
        '<div class="week-day-arrow">›</div>' +
      '</div>' +
      '<div class="week-day-body">' +
        '<div class="week-meal-row" onclick="openSheet(' + d + ',\'comida\')">' +
          '<div class="wm-icon">' + m.comida.icon + '</div>' +
          '<div class="wm-info">' +
            '<div class="wm-type c">☀️ Comida</div>' +
            '<div class="wm-name">' + m.comida.name + '</div>' +
            '<div class="wm-meta">' + m.comida.mins + ' min · ' + sp_c + 'g prot. · ' + sk_c + ' kcal</div>' +
          '</div><div class="wm-arrow">›</div>' +
        '</div>' +
        '<div class="week-meal-row" onclick="openSheet(' + d + ',\'cena\')">' +
          '<div class="wm-icon">' + m.cena.icon + '</div>' +
          '<div class="wm-info">' +
            '<div class="wm-type ce">🌙 Cena</div>' +
            '<div class="wm-name">' + m.cena.name + '</div>' +
            '<div class="wm-meta">' + m.cena.mins + ' min · ' + sp_ce + 'g prot. · ' + sk_ce + ' kcal</div>' +
          '</div><div class="wm-arrow">›</div>' +
        '</div>' +
      '</div></div>';
  }
  document.getElementById('vsemana').innerHTML = html;
}

function toggleWkDay(d) {
  var el = document.getElementById('wd' + d);
  if (el) el.classList.toggle('open');
}

/* ════════════════════════════════════════════
   VIEW: COMPRA
════════════════════════════════════════════ */
function renderCompra() {
  var allItems = [];
  var cats = Object.keys(SHOP);
  for (var ci = 0; ci < cats.length; ci++) {
    var items = SHOP[cats[ci]];
    for (var ii = 0; ii < items.length; ii++) allItems.push(items[ii]);
  }
  var ckCount = 0;
  for (var k in shopCk) { if (shopCk[k]) ckCount++; }
  var pct = Math.round(ckCount / allItems.length * 100);
  var modeLabel = currentMode === 'two' ? 'Para 2 personas' : currentMode === 'one' ? 'Para 1 persona' : 'Comidas para 1, cenas para 2';

  var html = '<div class="shop-top">' +
    '<div class="shop-top-title">🏪 Mercadona · Semana completa</div>' +
    '<div class="shop-top-sub">' + modeLabel + ' · Con margen si os saltáis alguna comida.</div>' +
    '<div class="prog-wrap"><div class="prog-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="prog-label">' + ckCount + ' de ' + allItems.length + ' productos · ' + pct + '%</div>' +
    '</div>' +
    '<div class="info-banner" style="border-color:rgba(212,168,67,.2);background:rgba(212,168,67,.05);margin-bottom:6px">' +
    '<div class="ib-icon">💡</div><div class="ib-body"><div class="ib-title">¿Qué comprar sí o sí?</div>' +
    '<div class="ib-text">Los productos <span style="background:rgba(212,168,67,.12);color:#d4a843;font-weight:700;padding:1px 6px;border-radius:4px;font-size:10px">desayuno opcional</span> son solo si desayunas en casa. El resto es imprescindible para las comidas y cenas.</div></div></div>';

  var gi = 0;
  for (var ci = 0; ci < cats.length; ci++) {
    var cat = cats[ci];
    var items = SHOP[cat];
    html += '<div class="shop-section"><div class="shop-cat-lbl">' + cat + '</div><div class="shop-list">';
    for (var ii = 0; ii < items.length; ii++) {
      var item = items[ii];
      var idx  = gi;
      var usoBadge = '';
      if (item.uso) {
        var isOpt = item.uso.indexOf('opcional') !== -1;
        var badgeCls = isOpt ? 'uso-gold' : 'uso-green';
        usoBadge = '<span class="uso-badge ' + badgeCls + '">' + item.uso + '</span>';
      }
      html += '<div class="shop-item ' + (shopCk[idx] ? 'ck' : '') + '" onclick="ckShop(' + idx + ')">' +
        '<div class="s-check"><span class="s-check-mark">✓</span></div>' +
        '<div class="s-info"><span class="s-name">' + item.n + usoBadge + '</span></div>' +
        '<span class="s-qty">' + scaleShopQty(item) + '</span>' +
        '</div>';
      gi++;
    }
    html += '</div></div>';
  }
  html += '<button class="reset-btn" onclick="clearShop()">↺ Reiniciar lista de la compra</button>';
  document.getElementById('vcompra').innerHTML = html;
}

function ckShop(i) {
  shopCk[i] = !shopCk[i];
  localStorage.setItem('mesa_shop', JSON.stringify(shopCk));
  renderCompra();
}
function clearShop() {
  shopCk = {};
  localStorage.setItem('mesa_shop', '{}');
  renderCompra();
}

/* ════════════════════════════════════════════
   VIEW: PREP
════════════════════════════════════════════ */
function renderPrep() {
  var html = '<div class="info-banner"><div class="ib-icon">🔪</div>' +
    '<div class="ib-body"><div class="ib-title">Prep por día</div>' +
    '<div class="ib-text">Pequeñas acciones cada día que hacen que cocinar sea <b>10 veces más rápido</b>.</div></div></div>';

  for (var pi = 0; pi < PREP_DAYS.length; pi++) {
    var pd = PREP_DAYS[pi];
    var items = pd.items;
    var done = 0;
    for (var ii = 0; ii < items.length; ii++) {
      if (prepCk[pi + '_' + ii]) done++;
    }
    var pct = Math.round(done / items.length * 100);
    html += '<div class="prep-day">' +
      '<div class="prep-day-hdr">' +
        '<div><div class="prep-day-title">' + pd.day + '</div>' +
        '<div class="prep-day-meta">' + pd.meta + '</div></div>' +
        '<div class="prep-day-pct">' + pct + '%</div>' +
      '</div>';
    for (var ii = 0; ii < items.length; ii++) {
      var item = items[ii];
      var key  = pi + '_' + ii;
      html += '<div class="prep-item ' + (prepCk[key] ? 'ck' : '') + '" onclick="ckPrep(' + pi + ',' + ii + ')">' +
        '<div class="prep-ico">' + item.ico + '</div>' +
        '<div class="prep-txt">' + item.txt + '</div>' +
        '<div class="prep-chk"><span class="prep-chk-mark">✓</span></div>' +
        '</div>';
    }
    html += '</div>';
  }

  html += '<div class="sec-head">Conservación</div>' +
    '<div class="prep-day">' +
      '<div class="prep-item"><div class="prep-ico">🧊</div><div class="prep-txt"><b style="color:var(--cream)">Arroz cocido.</b> Tupper hermético en nevera, 4-5 días. Al micro 2 min con un chorrito de agua.</div><div class="prep-chk" style="visibility:hidden"></div></div>' +
      '<div class="prep-item"><div class="prep-ico">🥚</div><div class="prep-txt"><b style="color:var(--cream)">Huevos duros.</b> Sin pelar en nevera, hasta 1 semana.</div><div class="prep-chk" style="visibility:hidden"></div></div>' +
      '<div class="prep-item"><div class="prep-ico">🍗</div><div class="prep-txt"><b style="color:var(--cream)">Pollo cocinado.</b> Tupper en nevera 3 días. Congela si es para más.</div><div class="prep-chk" style="visibility:hidden"></div></div>' +
      '<div class="prep-item"><div class="prep-ico">🥗</div><div class="prep-txt"><b style="color:var(--cream)">Hojas lavadas.</b> Tupper con papel de cocina absorbente, 3-4 días perfectas.</div><div class="prep-chk" style="visibility:hidden"></div></div>' +
      '<div class="prep-item"><div class="prep-ico">🫘</div><div class="prep-txt"><b style="color:var(--cream)">Legumbres abiertas.</b> En tupper con agua fría en nevera, máximo 3 días.</div><div class="prep-chk" style="visibility:hidden"></div></div>' +
    '</div>' +
    '<button class="reset-btn" onclick="clearPrep()">↺ Reiniciar preparación</button>';

  document.getElementById('vprep').innerHTML = html;
}

function ckPrep(pd, i) {
  var key = pd + '_' + i;
  prepCk[key] = !prepCk[key];
  localStorage.setItem('mesa_prep', JSON.stringify(prepCk));
  renderPrep();
}
function clearPrep() {
  prepCk = {};
  localStorage.setItem('mesa_prep', '{}');
  renderPrep();
}

/* ════════════════════════════════════════════
   NAVIGATION
════════════════════════════════════════════ */
function goTab(name, btn) {
  var views = document.querySelectorAll('.view');
  for (var i = 0; i < views.length; i++) views[i].classList.remove('on');
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('on');
  document.getElementById('v' + name).classList.add('on');
  btn.classList.add('on');
  if (name === 'semana') renderSemana();
  if (name === 'compra') renderCompra();
  if (name === 'prep')   renderPrep();
  if (name === 'hoy')    { renderHoy(); buildStrip(); }
}

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
buildStrip();
updateModePill();

if (!localStorage.getItem('mesa_mode')) {
  pendingMode = 'two';
  renderModeOptions();
  document.getElementById('modeOverlay').classList.remove('hidden');
}

renderHoy();

setInterval(function(){
  var v = document.querySelector('.view.on');
  if (v && v.id === 'vhoy') renderHoy();
}, 60000);
</script>
</body>
